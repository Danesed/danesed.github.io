name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Every day at 05:30 UTC, so a paper dblp has just indexed shows up by itself.
  schedule:
    - cron: "30 5 * * *"
  # "Run workflow" in the Actions tab, for a rebuild on demand.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Standard library only: the Python on the runner is enough. When dblp cannot
      # be reached the build uses data/publications.json and still deploys.
      - name: Build
        run: python3 build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
